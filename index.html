<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>極上有機野菜 | プレミアムファーム</title>
    <style>
        /* 水色をベースにしたデザイン */
        :root {
            --bg-color: #e1f5fe;
            --primary-color: #0288d1;
            --text-color: #333;
            --card-bg: #ffffff;
            --accent-color: #ff9800;
            --price-color: #d32f2f;
            --grow-bg: #f1f8e9;
            --grow-border: #8bc34a;
        }

        body {
            font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            line-height: 1.6;
        }

        header {
            background-color: var(--primary-color);
            color: white;
            text-align: center;
            padding: 4rem 1rem;
            overflow: hidden;
        }

        .don-impact {
            font-size: 3rem;
            margin: 0;
            font-weight: 900;
            opacity: 0;
            transform: scale(3);
            animation: don-animation 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        .sub-impact {
            font-size: 1.2rem;
            margin-top: 1rem;
            font-weight: bold;
            color: #fffde7;
            opacity: 0;
            animation: fade-in 1s ease-out 0.5s forwards;
        }

        @keyframes don-animation {
            0% { opacity: 0; transform: scale(3) translateY(-50px); }
            100% { opacity: 1; transform: scale(1) translateY(0); }
        }

        @keyframes fade-in {
            to { opacity: 1; }
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 2rem 1rem;
        }

        .message-box {
            background: white;
            border: 4px solid var(--primary-color);
            border-radius: 10px;
            padding: 2rem;
            text-align: center;
            margin-bottom: 3rem;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .message-box h2 {
            color: var(--primary-color);
            margin-top: 0;
        }

        /* 野菜グリッド */
        .veggie-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1.5rem;
            margin-bottom: 4rem;
        }

        .veggie-card {
            background: var(--card-bg);
            border-radius: 8px;
            padding: 1.5rem;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            text-align: center;
            transition: transform 0.2s;
            display: flex;
            flex-direction: column;
        }

        .veggie-card:hover {
            transform: translateY(-5px);
        }

        .veggie-name {
            font-size: 1.6rem;
            font-weight: bold;
            color: var(--primary-color);
            margin-bottom: 0.2rem;
        }

        .veggie-price {
            font-weight: bold;
            margin: 0.5rem 0;
        }
        
        .price-num {
            font-size: 1.8rem;
            color: var(--price-color);
            margin: 0 0.2rem;
            font-family: impact, sans-serif;
            letter-spacing: 1px;
        }

        .veggie-info {
            font-size: 0.9rem;
            color: #666;
            margin-bottom: auto;
        }

        .show-grow-btn {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 0.8rem 1.5rem;
            border-radius: 25px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 1rem;
            transition: background-color 0.2s;
            width: 100%;
        }

        .show-grow-btn:hover {
            background-color: #0277bd;
        }

        .grow-detail {
            display: none;
            margin-top: 1rem;
            padding: 1rem;
            background-color: var(--grow-bg);
            border-left: 4px solid var(--grow-border);
            border-radius: 4px;
            font-size: 0.9rem;
            text-align: left;
            animation: slide-down 0.3s ease-out;
        }

        @keyframes slide-down {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .comment-section {
            background: white;
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }

        .preview-badge {
            display: inline-block;
            background-color: #ff9800;
            color: white;
            font-size: 0.8rem;
            padding: 0.2rem 0.6rem;
            border-radius: 4px;
            margin-left: 10px;
            vertical-align: middle;
        }

        .comment-form {
            display: flex;
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .comment-input {
            flex: 1;
            padding: 0.8rem;
            border: 2px solid var(--bg-color);
            border-radius: 4px;
            font-size: 1rem;
        }

        .submit-btn {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 0.8rem 2rem;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
        }

        .submit-btn:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }

        .comment-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .comment-item {
            padding: 1rem;
            border-bottom: 1px solid #eee;
            animation: fade-in 0.5s;
        }
        
        .comment-item:last-child {
            border-bottom: none;
        }

        .loading-text {
            color: #666;
            font-style: italic;
        }
    </style>
</head>
<body>

    <header>
        <h1 class="don-impact">妥協ゼロの有機野菜。</h1>
        <p class="sub-impact">値段は高い。しかし、品質は絶対保証。</p>
    </header>

    <div class="container">
        <section class="message-box">
            <h2>完全無農薬・有機栽培</h2>
            <p>私たちが育てる野菜は、農薬や化学肥料を一切使用していません。<br>
            土づくりに何年もかけ、自然の力を最大限に引き出した究極の野菜たちです。<br>
            スーパーの野菜よりお値段は張りますが、一口食べればその理由がわかります。</p>
        </section>

        <section class="veggie-grid" id="veggie-container">
            <!-- 野菜リストはJSで生成します -->
        </section>

        <section class="comment-section">
            <h2 style="color: var(--primary-color);">お客様の声・ご期待のコメント <span id="preview-badge" class="preview-badge" style="display: none;">プレビューモード</span></h2>
            <form id="comment-form" class="comment-form">
                <input type="text" id="comment-input" class="comment-input" placeholder="野菜への期待や感想を書き込んでください！" required>
                <button type="submit" class="submit-btn">投稿する</button>
            </form>
            
            <ul id="comment-list" class="comment-list">
                <li class="loading-text">コメントを読み込み中...</li>
            </ul>
        </section>
    </div>

    <!-- Firebase JS SDK v10 (CDN Module) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.0.0/firebase-app.js";
        // onSnapshotを追加（リアルタイム動作用）
        import { getFirestore, collection, addDoc, query, orderBy, serverTimestamp, onSnapshot } from "https://www.gstatic.com/firebasejs/10.0.0/firebase-firestore.js";

        // ==========================================
        // Firebase Configuration (★ここに自分の設定を貼り付けます)
        // ==========================================
        const firebaseConfig = {
            //   apiKey: "AIzaSyALTI0b6viJl5K8AhciTcBTQCxG0SqcnQY",
 　　　　　　// 　authDomain: "sanchi-33659.firebaseapp.com",
            //   projectId: "sanchi-33659",
            //   storageBucket: "sanchi-33659.firebasestorage.app",
            //   messagingSenderId: "906652841467",
            //  appId: "1:906652841467:web:0d7be5e131a74917c2875e"
        };

        let isPreviewMode = false;
        if (!firebaseConfig || Object.keys(firebaseConfig).length === 0 || 
            (firebaseConfig.apiKey && firebaseConfig.apiKey.includes("YOUR_"))) {
            isPreviewMode = true;
        }
        
        let db = null;
        
        let localComments = [
            { text: "Firebase configが設定されていないため、現在のプレビューモードです。" },
            { text: "かぼちゃのホクホク感がたまりませんでした！また買います。" },
            { text: "本当に無農薬なんですね。安心して子供に食べさせられます。" }
        ];

        if (!isPreviewMode) {
            try {
                const app = initializeApp(firebaseConfig);
                db = getFirestore(app);
            } catch (error) {
                console.error("Firebase初期化エラー:", error);
                isPreviewMode = true; 
            }
        }

        if (isPreviewMode) {
            document.getElementById('preview-badge').style.display = 'inline-block';
            document.getElementById('comment-input').placeholder = "Firebase config未設定のためプレビューモードで動作中";
        }

        // ==========================================
        // UI Logic: 野菜の描画と「育て方」開閉
        // ==========================================
        const vegetables = [
            { name: "トマト", price: "500", growDetail: "毎日手作業でわき芽を摘み、一本の主枝に栄養を集中。水やりを極限まで控えることで、トマト自身の生きる力を引き出し、驚異的な甘みと旨みをドンッと凝縮させました。" },
            { name: "ナス", price: "400", growDetail: "「肥料食い」のナスには、自家製の完熟ぼかし肥料をふんだんに与え、深い溝施肥で根を広く張らせました。真夏の水分管理を徹底し、色艶が良く、とろけるような果肉に育て上げています。" },
            { name: "小玉スイカ", price: "1,500", growDetail: "親蔓を摘心し、厳選した子蔓3本だけを伸ばして、1株からたった1球だけをドンッと収穫。太陽の光をまんべんなく当てる「玉直し」を何度も行い、皮のキワまで甘い究極の一球です。" },
            { name: "メロン", price: "2,000", growDetail: "病害虫に非常に弱いメロンを、無農薬で育てるのは至難の業。カボチャの台木に接木し、湿度・温度を24時間体制で管理。網目の美しさと、とろけるような甘さ、芳醇な香りを追求した芸術品です。" },
            { name: "ピーマン", price: "350", growDetail: "乾燥を嫌うため、株元をマルチで覆い、常に適度な水分を維持。若取りを徹底することで株への負担を減らし、ビタミンたっぷりでピーマン特有の苦味が少ない、肉厚でジューシーな味わいです。" },
            { name: "バジル", price: "300", growDetail: "少しでも乾燥すると葉が硬くなるため、水やりは欠かせません。花芽が出たらすぐに切り戻し、新しい柔らかい葉を次々と出させます。香りが最も強くなる午前中に収穫し、ドンッと強い芳香を届けます。" },
            { name: "とうもろこし", price: "600", growDetail: "生の米ぬかや自家製堆肥を高カロリーに配合し、初期生育を一気に促進。アワノメイガ対策は手作業での捕殺と雄花の間引き。収穫後1時間で糖度が落ちるため、早朝に収穫し即座にお届けします。" },
            { name: "じゃがいも", price: "500", growDetail: "土づくりに2年をかけ、石を取り除いた柔らかい土で育てました。土寄せを何度も行い、日光が当たって青くなるのを防ぐことで、えぐみがなく、ホクホクとした食感と土の香りが活きた仕上がりです。" },
            { name: "かぼちゃ", price: "800", growDetail: "広い土地で蔓をのびのびと伸ばし、人工授粉で確実に着果。疫病を防ぐために敷き草を敷き、果梗（ヘタ）がひび割れて完熟するまでじっくり待つことで、ドンッと濃厚な甘みとホクホク感を引き出しました。" },
            { name: "ダイコン", price: "450", growDetail: "土を深く耕し、石や肥料の塊を完全に取り除くことで、まっすぐで美しいダイコンに。間引きを段階的に行い、1本1本に栄養を行き渡らせ、きめ細やかでみずみずしい、甘みのある大根です。" }
        ];

        const veggieContainer = document.getElementById('veggie-container');

        vegetables.forEach(veggie => {
            const card = document.createElement('div');
            card.className = 'veggie-card';
            
            card.innerHTML = `
                <div class="veggie-name">${veggie.name}</div>
                <div class="veggie-price">1袋 <span class="price-num">¥${veggie.price}</span></div>
                <p class="veggie-info">完全無農薬 / 特級有機栽培</p>
                <button class="show-grow-btn">どのように育てたか見る</button>
                <div class="grow-detail">
                    ${veggie.growDetail}
                </div>
            `;
            veggieContainer.appendChild(card);
        });

        document.querySelectorAll('.show-grow-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                const detail = e.target.nextElementSibling;
                if (detail.style.display === 'block') {
                    detail.style.display = 'none';
                    e.target.textContent = 'どのように育てたか見る';
                } else {
                    detail.style.display = 'block';
                    e.target.textContent = '閉じる';
                }
            });
        });

        // ==========================================
        // Firestore Logic: コメントのリアルタイム同期
        // ==========================================
        const commentForm = document.getElementById('comment-form');
        const commentInput = document.getElementById('comment-input');
        const commentList = document.getElementById('comment-list');

        function setupComments() {
            if (isPreviewMode) {
                // プレビューモード：ローカル配列を描画
                const renderLocal = () => {
                    commentList.innerHTML = '';
                    localComments.forEach((data) => {
                        const li = document.createElement('li');
                        li.className = 'comment-item';
                        li.textContent = data.text;
                        commentList.appendChild(li);
                    });
                };
                renderLocal();
                
                // 送信処理（ローカル）
                commentForm.addEventListener('submit', (e) => {
                    e.preventDefault();
                    const text = commentInput.value.trim();
                    if (!text) return;
                    
                    const submitBtn = commentForm.querySelector('.submit-btn');
                    submitBtn.disabled = true;
                    submitBtn.textContent = '送信中...';
                    
                    setTimeout(() => {
                        localComments.unshift({ text: text });
                        commentInput.value = '';
                        renderLocal();
                        submitBtn.disabled = false;
                        submitBtn.textContent = '投稿する';
                    }, 400);
                });
                return;
            }

            // 本番モード：Firebase リアルタイムリスナー (onSnapshot)
            if (!db) return;

            const q = query(collection(db, "comments"), orderBy("createdAt", "desc"));
            
            // 誰かがコメントを追加したら、自動的にここが実行されて画面が更新されます
            onSnapshot(q, (querySnapshot) => {
                commentList.innerHTML = '';
                
                if (querySnapshot.empty) {
                    commentList.innerHTML = '<li class="loading-text">まだコメントはありません。一番乗りで感想を書き込みましょう！</li>';
                    return;
                }

                querySnapshot.forEach((doc) => {
                    const data = doc.data();
                    // createdAtがまだサーバーに到達していない（nullの）瞬間を弾く
                    if(data.createdAt === null) return; 

                    const li = document.createElement('li');
                    li.className = 'comment-item';
                    li.textContent = data.text;
                    commentList.appendChild(li);
                });
            }, (error) => {
                console.error("リアルタイム同期エラー:", error);
                if (error.code === 'failed-precondition') {
                    commentList.innerHTML = '<li class="loading-text">表示にはFirestoreのインデックス作成が必要です。コンソールのURLから作成してください。</li>';
                }
            });

            // 送信処理（Firebaseへ保存）
            commentForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                const text = commentInput.value.trim();
                if (!text) return;

                const submitBtn = commentForm.querySelector('.submit-btn');
                submitBtn.disabled = true;
                submitBtn.textContent = '送信中...';

                try {
                    await addDoc(collection(db, "comments"), {
                        text: text,
                        createdAt: serverTimestamp()
                    });
                    // 保存成功したら入力欄を空にするだけ（画面更新はonSnapshotが自動でやってくれます）
                    commentInput.value = '';
                } catch (error) {
                    console.error("コメント追加エラー:", error);
                    alert('コメントの送信に失敗しました。');
                } finally {
                    submitBtn.disabled = false;
                    submitBtn.textContent = '投稿する';
                }
            });
        }

        setupComments();

    </script>
</body>
</html>
